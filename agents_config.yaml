# agents_config.yaml
# Single source for defining MCP servers and Agents to load.

# --- Define MCP Servers ---
# Dictionary where keys are unique identifiers used by agents in 'mcp_server_key'.
mcp_servers:
  playwright_mcp: # Unique key for the Playwright server
    type: "sse" # sse / stdio
    params:
      # REQUIRED: URL for the server
      url: "http://localhost:8931/sse"
      # Optional: Name used in logs/tracing for this specific server instance
      name: "Playwright MCP Server"
      # Optional: Add other parameters needed by MCPServerSse 'params' dictionary if required
      # headers: { Authorization: "Bearer YOUR_PLAYWRIGHT_TOKEN" } # Example

  memory_mcp:
    type: "stdio"
    params:
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-memory"
  # Add definitions for any other MCP servers your agents might need...
# --- Define Agents ---
agents:
  - name: BrowserToolAgent # This name WILL be used as the tool_name
    model: gpt-4.1-mini
    mcp_server_key: playwright_mcp
    # Renamed field for tool description override:
    description: "Use this Agent to control a web browser: navigate, screenshot, click, input text etc."
    parameters:
      instructions: >
        You are an expert browser controller. Precisely execute browser tasks
        using the provided tools (like navigate, screenshot, click, input text).
        Focus only on executing the requested browser action.
        When done, tell the user what happened, and provide all relevant information. So the user can make follow up requests.
        Note the user does not have direct access to the browser, so the user must rely on you to perform the actions, and provide the results in a clear and concise manner.
        You can also ask the user for clarifications if needed.
        When filling out forms, you must ask the user for the values to fill in. Try to be as specific as possible, and ask for the exact values to fill in, you should try to list all the fields that need to be filled in, and ask the user for the values.

        Leverage all the browser tools available to you.



        Important Notes:
          Tab index is NOT 0-based, so the first tab is 1, the second tab is 2, etc.
          When searching on LinkedIn remember to hit Enter to trigger the search. There's no button to click.
          After each action, you should wait for the page to load, and then check if the action was successful.
          Some webpages may require you to wait for a specific element to load before proceeding.
          Some webpage elements are very volitile, and may require you to retry many times before succeeding, be patient, and keep trying.
      model_settings:
        tool_choice: required
      # Optional: Can still exist as a fallback if 'description' above is missing
      handoff_description: "Controls a web browser (navigation, screenshots, interaction)."


  - name: ProfileSpecialistAgent # This name WILL be used as the tool_name
    model: gpt-4.1-nano
    # Renamed field for tool description override:
    description: "Use this Agent to write special curated contents for LinkedIn profiles, or anything writing related."
    parameters:
      instructions: >
        You are a Profile specialist. Your task is to assist the user
        in writing and curating content for their LinkedIn profile.
        You will provide suggestions, edits, and improvements to the user's profile content.
      model_settings:
        tool_choice: required
      # Optional: Can still exist as a fallback if 'description' above is missing
      handoff_description: "Bearerer of the special content writing process."

  - name: MemoryAgent # This name WILL be used as the tool_name
    model: gpt-4.1-nano
    # Renamed field for tool description override:
    description: "Use this Agent to remember and recall information."
    mcp_server_key: memory_mcp
    parameters:
      instructions: >
        You are a Memory agent. Your task is to remember and recall information
        as needed. You will assist the user in storing and retrieving important
        details, notes, or any other relevant information.
      model_settings:
        tool_choice: required
      # Optional: Can still exist as a fallback if 'description' above is missing
      handoff_description: "Remembers and recalls information."

  - name: PlanningAgent # This name WILL be used as the tool_name
    model: gpt-4.1-nano
    # Renamed field for tool description override:
    description: "Use this Agent to break down a complex goal into smaller steps understandable by other tools."
    parameters:
      instructions: >
        Analyze the user's overall goal. Break it down into a logical sequence
        of smaller, actionable steps. Each step should be clearly achievable by
        one of the available tool agents (like the browser agent).
        Present the plan clearly.
        Notice that you do not need to come up with a full plan in one go.
        You are encouraged to come up with a partial plan to start with, and then ask the user to come back to you after trying to do them. Then you can come up with the next steps.
        The key is to be dynamic and flexible, and to be able to adapt to the user's needs, and the results of the previous steps.
      model_settings:
        temperature: 0.4
      # Optional fallback:
      handoff_description: "Creates step-by-step plans."
